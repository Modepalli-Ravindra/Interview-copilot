# Render Blueprint — InterviewPilot backend (single free web service).
#
# Runs BOTH processes in one container via backend/supervisor.sh:
#   - OmniRoute AI gateway on :20128 (internal only)
#   - Express + Socket.IO backend on $PORT (public, Render injects PORT)
#
# Deploy: push this repo to GitHub, then in the Render Dashboard choose
#   New -> Blueprint -> your repo -> render.yaml. Render prompts for the
#   sync:false secrets on first sync.
#
# SECURITY: never put real secret values in this file. Secret env vars are
# marked `sync: false` — supply their values through Render's dashboard UI /
# secret manager after the Blueprint is created.
#
# Note: free instances have NO persistent disk — OmniRoute's quota/SQLite
# state and the backend GitHub cache reset on each deploy/restart (acceptable
# for a single-user app; real data lives in Supabase).

services:
  - type: web
    name: interviewpilot-api
    runtime: docker
    plan: free
    region: singapore # closest to the user; change freely
    branch: main
    dockerfilePath: ./backend/Dockerfile.render
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    numInstances: 1

    envVars:
      # ── Server ──────────────────────────────────────────────
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      # CORS origin for REST + Socket.IO. MUST be exactly the deployed frontend
      # origin with NO quotes, NO trailing slash, NO path:
      #   https://my-vercel-app.vercel.app
      # A stray newline/quote makes Node throw ERR_INVALID_CHAR on every
      # request (the value lands in the Access-Control-Allow-Origin header).
      - key: FRONTEND_URL
        sync: false
      # ── Security ────────────────────────────────────────────
      # AUTH_TEST_MODE (test-only JWT bypass) must NEVER be set here — it is
      # only for the offline backend/scripts/* smoke suites.
      # JWT secret for account auth (register/login + all /api routes except
      # /health + socket handshake). REQUIRED: server.ts refuses to boot in
      # production without it. Generate with:
      #   node -e "console.log(require('crypto').randomBytes(48).toString('hex'))"
      - key: JWT_SECRET
        sync: false
      # ── Database (Supabase) ─────────────────────────────────
      # URL + publishable key for the sessions store (Supabase JS client).
      #   URL: Project Settings -> API -> Project URL
      #   KEY: Project Settings -> API -> publishable key (sb_publishable_...)
      # Prereq: run backend/db/schema.sql once in the Supabase SQL editor.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      # Backend-only privileged key for user management (register/login on the
      # `users` table). Service-role key bypasses RLS so the table can stay
      # RLS-enabled while the server creates/looks up users. NEVER expose to
      # the frontend, NEVER put in a VITE_* variable.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # ── Resume file storage (Supabase S3-compatible, optional) ──
      # Without these, resume parsing still works but uploaded files are not
      # persisted (History cannot re-download them). Secrets from
      #   Project Settings -> Storage -> S3 Access Keys.
      - key: SUPABASE_S3_ENDPOINT
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY
        sync: false
      - key: SUPABASE_S3_SECRET_KEY
        sync: false
      - key: SUPABASE_S3_REGION
        value: us-east-1
      - key: SUPABASE_S3_BUCKET
        value: resumes
      - key: SUPABASE_S3_PATH_STYLE
        value: "true"
      # ── Code execution (Judge0, optional) ───────────────────
      # Unset = public https://ce.judge0.com (rate-limited, no key). Only
      # needed for a self-hosted Judge0 or a RapidAPI-style host.
      # - key: JUDGE0_URL
      #   sync: false
      # - key: JUDGE0_API_KEY
      #   sync: false
      # - key: JUDGE0_HOST
      #   sync: false
      # ── AI provider chain ───────────────────────────────────
      # OmniRoute runs inside this same container; opencode is not deployed.
      - key: AI_PROVIDER_ORDER
        value: omniroute
      - key: OMNIROUTE_URL
        value: http://127.0.0.1:20128
      - key: OMNIROUTE_MODEL
        value: auto
      - key: OMNIROUTE_TIMEOUT_MS
        value: "120000"
      - key: AI_GATEWAY_MAX_RETRIES
        value: "1"
      # ── Container memory budget (512MB free tier) ───────────
      # Heaps tuned so combined RSS stays under the 512MB cgroup limit
      # (status 137 = OOM kill if exceeded). The backend does the heavy work
      # (Express + Socket.IO + Supabase + AI response buffering) so it gets the
      # larger share; OmniRoute is a minimal loopback router.
      - key: OMNIROUTE_MEMORY_MB
        value: "64"
      - key: BACKEND_MEMORY_MB
        value: "192"
      # opencode fallback is not available on Render.
      - key: OPENCODE_SERVER_URL
        value: disabled

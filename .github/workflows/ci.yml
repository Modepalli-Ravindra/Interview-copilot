name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tsc build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check & compile
        run: npm run build

  backend-tests:
    name: Backend (offline deterministic suites)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run build

      - name: Auth + ownership (27 checks)
        run: node scripts/smokeAuth.js

      - name: DB persistence round-trip (user_id + voice, reload)
        run: node scripts/smokePersistence.js

      - name: Core REST smoke + persistence (26 checks)
        run: node scripts/smokeIntelligence.js

      - name: Coding engine (phase 3, 19 checks)
        run: node scripts/smokePhase3.js

      - name: Adaptive coding interview (phase 5, 29 checks)
        run: node scripts/smokePhase5.js

      - name: Coding metrics (phase 5 metrics, 37 checks)
        run: node scripts/smokePhase5Metrics.js

      - name: Realtime voice (phase 6, 106 checks)
        run: node scripts/smokePhase6.js

      - name: Resume/JD intelligence (58 checks)
        run: node scripts/testIntelligence.js

      - name: Resume/JD matching (42 checks)
        run: node scripts/testResumeJdMatch.js

      - name: GitHub analyzer (104 checks)
        run: node scripts/testGithubAnalyzer.js

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check & build
        run: npm run build

  dockerfile:
    name: Validate + boot containers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t interviewpilot-backend:ci ./backend

      - name: Build Render image
        run: docker build -f backend/Dockerfile.render -t interviewpilot-render:ci ./backend

      - name: Lint supervisor script
        run: bash -n backend/supervisor.sh

      - name: Boot backend image and probe health
        run: |
          docker run -d --name ip-backend-smoke \
            -e NODE_ENV=production -e JWT_SECRET="$(openssl rand -hex 32)" \
            -e FRONTEND_URL=http://localhost:5173 -e PORT=3000 \
            -p 3000:3000 interviewpilot-backend:ci
          ok=""
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          docker logs ip-backend-smoke 2>&1 | tail -30 || true
          docker rm -f ip-backend-smoke >/dev/null 2>&1 || true
          if [ -z "$ok" ]; then
            echo "::error::backend container never became healthy"
            exit 1
          fi

      - name: Boot Render image (supervisor + OmniRoute) under a 512MB cap and probe health
        run: |
          docker run -d --name ip-render-smoke --memory=512m --memory-swap=512m --cpus=1 \
            -e NODE_ENV=production -e JWT_SECRET="$(openssl rand -hex 32)" \
            -e FRONTEND_URL=http://localhost:5173 -e PORT=3000 \
            -p 3001:3000 interviewpilot-render:ci
          ok=""
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:3001/api/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          docker logs ip-render-smoke 2>&1 | tail -80 || true
          docker stats --no-stream ip-render-smoke || true
          if [ -z "$ok" ]; then
            echo "::error::Render container (supervisor + OmniRoute) never became healthy"
            docker rm -f ip-render-smoke >/dev/null 2>&1 || true
            exit 1
          fi

      - name: Verify OmniRoute reachable and exactly one process per service
        run: |
          ok=""
          for i in $(seq 1 30); do
            if docker exec ip-render-smoke node -e "fetch('http://127.0.0.1:20128/v1/models',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok||r.status===200?0:1)).catch(()=>process.exit(1))"; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "::error::OmniRoute not reachable on 127.0.0.1:20128"
            docker rm -f ip-render-smoke >/dev/null 2>&1 || true
            exit 1
          fi
          omniroute=$(docker exec ip-render-smoke sh -c "ps -eo args= | grep -c 'run-standalone.mjs'" || true)
          backend=$(docker exec ip-render-smoke sh -c "ps -eo args= | grep -c 'dist/server.js'" || true)
          echo "omniroute processes=$omniroute backend processes=$backend"
          if [ "$omniroute" != "1" ] || [ "$backend" != "1" ]; then
            echo "::error::expected exactly 1 OmniRoute + 1 backend process, got $omniroute/$backend"
            docker rm -f ip-render-smoke >/dev/null 2>&1 || true
            exit 1
          fi

      - name: Verify no OOM under 512MB and SIGTERM exits 0
        run: |
          oom=$(docker inspect -f '{{.State.OOMKilled}}' ip-render-smoke)
          echo "OOMKilled=$oom"
          if [ "$oom" = "true" ]; then
            echo "::error::container was OOM-killed under the 512MB cap (status 137)"
            docker rm -f ip-render-smoke >/dev/null 2>&1 || true
            exit 1
          fi
          docker kill --signal=SIGTERM ip-render-smoke >/dev/null 2>&1 || true
          code=$(docker wait ip-render-smoke)
          docker logs ip-render-smoke 2>&1 | tail -30 || true
          docker rm -f ip-render-smoke >/dev/null 2>&1 || true
          if [ "$code" != "0" ]; then
            echo "::error::supervisor did not exit 0 on SIGTERM (got $code)"
            exit 1
          fi
          echo "SIGTERM graceful exit code: $code"
